server.address=127.0.0.1
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.tomcat.threads.max=32

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.hbm2ddl.skip_default_import_file=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:cloud-catalog.sql
spring.sql.init.encoding=UTF-8

ip.frontend=${FRONTEND_URL}
jwt.secret=${JWT_SECRET}
compraamigo.bootstrap.admin-email=${APP_INIT_ADMIN_EMAIL:}
compraamigo.bootstrap.admin-password=${APP_INIT_ADMIN_PASSWORD:}
